name: global-mode-smoke

# Cross-OS smoke test of the CLI's global mode. Runs on the commit it is triggered on: pack the CLI and Core
# from this checkout once on Linux, then install the packed CLI globally with npm and run the smoke script
# on macOS, Windows and Linux.
on:
  push:
    branches: [global-mode-smoke]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@11.10.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pack CLI and Core
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          pnpm -F @astryxdesign/build build
          pnpm -F @astryxdesign/core pack --pack-destination "$RUNNER_TEMP/packs"
          pnpm -F @astryxdesign/cli pack --pack-destination "$RUNNER_TEMP/packs"
          ls -la "$RUNNER_TEMP/packs"
      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: ${{ runner.temp }}/packs/*.tgz
          if-no-files-found: error

  smoke:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/global-mode-smoke
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: packs
          path: packs
      - name: Smoke test
        run: node .github/global-mode-smoke/global-mode-smoke.mjs --packs packs --out results-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: results-${{ matrix.os }}.json
